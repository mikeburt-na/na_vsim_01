---
- name: Check NetApp ONTAP Cluster Health
  hosts: ontap_cluster
  gather_facts: false
  collections:
    - netapp.ontap
  vars:
    ontap_hostname: "{{ netapp_hostname }}"  # Pulled from inventory group vars
    ontap_username: "{{ netapp_username }}"  # Pulled from inventory group vars
    ontap_password: "{{ netapp_password }}"  # Pulled from inventory group vars
    ontap_https: true
    ontap_validate_certs: false           # Set to true in production with valid certs

  tasks:
    - name: Gather ONTAP health and status information
      netapp.ontap.na_ontap_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: "{{ ontap_https }}"
        validate_certs: "{{ ontap_validate_certs }}"
        gather_subset:
          - cluster_identity_info      # Cluster details
          - cluster_node_info          # Node health and status
          - subsys_health_info         # Subsystem health
          - sys_cluster_alerts         # Cluster alerts
          - env_sensors_info           # Environmental sensors (hardware health)
          - autosupport_check_info     # AutoSupport status
          - storage_failover_info      # HA failover status
          - aggregate_info             # Aggregate status
          - volume_info                # Volume status
          - disk_info                  # Disk health
          - shelf_info                 # Shelf health
      register: ontap_health_info

    - name: Display overall cluster health information (optional detailed output)
      ansible.builtin.debug:
        var: ontap_health_info.ontap_info
      when: false  # Set to true to inspect the structure; change to false for simple output

    - name: Set facts for health checks
      ansible.builtin.set_fact:
        cluster_alerts_status: "{{ 'Bad' if (ontap_health_info.ontap_info.sys_cluster_alerts is defined and (ontap_health_info.ontap_info.sys_cluster_alerts | json_query('[? \"alert-severity\" == `ERROR` || \"alert-severity\" == `EMERGENCY`]') | default([]) | length > 0)) else 'Good' }}"
        node_health_status: "{{ 'Bad' if (ontap_health_info.ontap_info.cluster_node_info is defined and (ontap_health_info.ontap_info | json_query('cluster_node_info | keys(@) | [? cluster_node_info[@].\"is-node-healthy\" == `false`]') | default([]) | length > 0)) else 'Good' }}"
        subsystem_health_status: "{{ 'Bad' if (ontap_health_info.ontap_info.subsys_health_info is defined and (ontap_health_info.ontap_info | json_query('subsys_health_info | keys(@) | [? subsys_health_info[@].\"subsystem-health\" != `ok`]') | default([]) | length > 0)) else 'Good' }}"

    - name: Output Cluster Alerts Status
      ansible.builtin.debug:
        msg: "Cluster Alerts: {{ cluster_alerts_status }}"

    - name: Output Node Health Status
      ansible.builtin.debug:
        msg: "Node Health: {{ node_health_status }}"

    - name: Output Subsystem Health Status
      ansible.builtin.debug:
        msg: "Subsystem Health: {{ subsystem_health_status }}"

    - name: Determine Overall Status
      ansible.builtin.set_fact:
        overall_status: "{{ 'Bad' if ('Bad' in [cluster_alerts_status, node_health_status, subsystem_health_status]) else 'Good' }}"

    - name: Output Overall Status
      ansible.builtin.debug:
        msg: "Overall Cluster Health: {{ overall_status }}"

    # Optional: Fail the playbook if overall is Bad (uncomment if needed)
    # - name: Fail if overall health is Bad
    #   ansible.builtin.fail:
    #     msg: "Cluster health check failed with Bad status."
    #   when: overall_status == 'Bad'