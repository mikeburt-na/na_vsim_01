  tasks:
    - name: Install the server CA certificate
      na_ontap_security_certificates:
        state: present  # Ensures installation (idempotent)
        name: "{{ cert_name }}"
        common_name: "{{ common_name }}"
        type: server_ca  # Specifies server CA type
        public_certificate: "{{ cert_pem_content | regex_replace('\n', '\\n') }}"  # Escape newlines for YAML
        # svm: "{{ svm_name }}"  # Uncomment and set for SVM-specific install (e.g., "vserver1")
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: "{{ validate_certs }}"
        use_rest: auto  # Auto-detect ZAPI/REST; set to 'always' for REST-only (ONTAP 9.6+)
      register: cert_install_result

    - name: Display installation result
      debug:
        msg: "Certificate '{{ cert_name }}' installed successfully. Details: {{ cert_install_result }}"