---
- name: Install Server CA Certificate in NetApp ONTAP
  hosts: ontap_cluster  # Targets localhost, as defined in inventory
  gather_facts: false
  collections:
    - netapp.ontap
  vars:
    # ONTAP connection details
    ontap_hostname: "{{ netapp_hostname | default('ontap1.example.com') }}"
    ontap_username: "{{ netapp_username | default('admin') }}"
    ontap_password: "{{ netapp_password | default('your_secure_password') }}"
    validate_certs: false  # Set to false for testing with self-signed ONTAP API certs

    # Certificate details
    cert_name: "server-ca-cert"
    common_name: "server-ca-testing.example.com"  # Matches new certificate CN
    cert_type: "server_ca"
    cert_pem_content: |
      -----BEGIN CERTIFICATE-----
      MIIDvTCCAqWgAwIBAgIUaqTTRpDzOzk6avc3YxwnpLsajU8wDQYJKoZIhvcNAQEL
      BQAwbjELMAkGA1UEBhMCVVMxEjAQBgNVBAgMCVRlc3RTdGF0ZTERMA8GA1UEBwwI
      VGVzdENpdHkxEDAOBgNVBAoMB1Rlc3RPcmcxJjAkBgNVBAMMHXNlcnZlci1jYS10
      ZXN0aW5nLmV4YW1wbGUuY29tMB4XDTI1MTAwMzE1MjEwOVoXDTI2MTAwMzE1MjEw
      OVowbjELMAkGA1UEBhMCVVMxEjAQBgNVBAgMCVRlc3RTdGF0ZTERMA8GA1UEBwwI
      VGVzdENpdHkxEDAOBgNVBAoMB1Rlc3RPcmcxJjAkBgNVBAMMHXNlcnZlci1jYS10
      ZXN0aW5nLmV4YW1wbGUuY29tMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKC
      AQEAsh+hbA+ZakM4Vu77uJgp+xJmdvigBiKn8kQTdR7kJgnFaYHQIC1QTwDJlVHB
      xF6iWMIT2OQzSHWRew3K4hDynTCD+bnrlzYCjMujJuNFNwCqLo+qevl7a5LcBUMC
      MMH9uMU6AIVh8jpBvRNQ+d9oN7rdPMvYeBb2hAXOMfYpizQdBdNGjhGP7r6ZM6kU
      W7HCDI2Y7p/2Q/BaWRm47xB57kS8lwYzJTzegi3qnATo/kaUcVW4JF6zOEkEpc+0
      VjVIqTJEV+pew7pfZWy4DQPm4UaixEdTFaHU0Gxyk0zFymK9ijZhYH8lcgSH3UTw
      9R7jUC4P8uprazcWCCNMWlwn1wIDAQABo1MwUTAdBgNVHQ4EFgQUd+OCkhv9g0zp
      dJpY9PiQFnIw7xwwHwYDVR0jBBgwFoAUd+OCkhv9g0zpdJpY9PiQFnIw7xwwDwYD
      VR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAQEAer5vwx+/xW1+CiDqn9Am
      agkNEaNWeMv98vMh/A8vPv4v1zjFElacxNOAZ9XVuxI/9W73YE5tJNCLcjhmrr3u
      SWjFHiTRtvVp6XyqXzX5lq3249Hpd/IjUf5xZE3OWQvq+RR3aDjzHcXgcAYCQ4fE
      pXxOqLrw+/yMOjB6PAdiGtg7y1zVRC/T/aPy4BzMIPGZSTVRh7NxHyNYrN78WDJf
      EmYh9xnF+sagP1mFqt/smjJ0OFqMOrn6RNWSy+e37udJiIVV/ugiOTUmsQ2r1xDj
