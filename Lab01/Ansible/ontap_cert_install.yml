---
- name: Install Server CA Certificate in NetApp ONTAP
  hosts: localhost
  gather_facts: false
  collections:
    - netapp.ontap
  vars:
    # ONTAP connection details (override via inventory or extra vars)
    ontap_hostname: "{{ netapp_hostname }}"  # e.g., cluster1.example.com
    ontap_username: "{{ netapp_username }}"  # Admin username
    ontap_password: "{{ netapp_password }}"  # Admin password
    validate_certs: false  # Set to false if using self-signed certs for connection

    # Certificate details
    cert_name: "server-ca-cert"  # Unique name for the certificate in ONTAP
    common_name: "Server CA"     # Common name (CN) from the cert; required for identification
    cert_pem_content: |
