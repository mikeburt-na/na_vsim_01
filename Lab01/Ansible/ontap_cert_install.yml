---
- name: Install Server CA Certificate in NetApp ONTAP
  hosts: ontap_cluster  # Targets localhost, as defined in inventory
  gather_facts: false
  collections:
    - netapp.ontap
  vars:
    # ONTAP connection details
    ontap_hostname: "{{ netapp_hostname | default('ontap1.example.com') }}"
    ontap_username: "{{ netapp_username | default('admin') }}"
    ontap_password: "{{ netapp_password | default('your_secure_password') }}"
    validate_certs: false  # Set to false for testing with self-signed ONTAP API certs

    # Certificate details
    cert_name: "server-ca-cert"
    common_name: "Server CA Testing"
    cert_type: "server_ca"  # Explicitly define type as variable for clarity
    cert_pem_content: |
