  tasks:
    - name: Debug certificate variables
      debug:
        msg: |
          cert_name: {{ cert_name }}
          common_name: {{ common_name }}
          cert_type: {{ cert_type }}
          public_certificate_length: {{ cert_pem_content | length }}

    - name: Install the server CA certificate
      na_ontap_security_certificates:
        state: present
        name: "{{ cert_name }}"
        common_name: "{{ common_name }}"
        type: "{{ cert_type }}"
        public_certificate: "{{ cert_pem_content | regex_replace('\n', '\\n') }}"
        # svm: "{{ svm_name }}"  # Uncomment for SVM-specific install
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: "{{ validate_certs }}"
        use_rest: always  # Force REST API for better compatibility (ONTAP 9.6+)
      register: cert_install_result
      failed_when: cert_install_result.failed or ('failed' in cert_install_result and cert_install_result.failed)

    - name: Display installation result
      debug:
        msg: "Certificate '{{ cert_name }}' installed successfully. Details: {{ cert_install_result }}"