---
- name: Check NetApp ONTAP Cluster Health
  hosts: ontap_cluster
  gather_facts: false
  collections:
    - netapp.ontap
  vars:
    ontap_hostname: "{{ netapp_hostname }}"
    ontap_username: "{{ netapp_username }}"
    ontap_password: "{{ netapp_password }}"
    ontap_https: true
    ontap_validate_certs: false

  tasks:
    - name: Gather ONTAP health and status information
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: "{{ ontap_https }}"
        validate_certs: "{{ ontap_validate_certs }}"
        gather_subset:
          - cluster
          - cluster/nodes
          - cluster/sensors
          - private/support/alerts
          - support/autosupport/check
          - storage/aggregates
          - storage/volumes
          - storage/disks
          - storage/shelves
      register: ontap_health_info

    # ---------------------------------------------------------
    # 1. Extract nodes
    # ---------------------------------------------------------
    - name: Extract list of nodes
      ansible.builtin.set_fact:
        all_nodes: "{{ ontap_health_info.ontap_info['cluster/nodes'].records | default([]) }}"

    # ---------------------------------------------------------
    # 2. Count how many nodes have the 'ha' object (means HA is configured)
    # ---------------------------------------------------------
    - name: Count nodes with HA configured
      ansible.builtin.set_fact:
        ha_capable_nodes: >-
          {{ all_nodes
             | map(attribute='ha.giveback_state', default=none)
             | select('string') | list | length }}

    # ---------------------------------------------------------
    # 3. Determine actual HA state
    # ---------------------------------------------------------
    - name: Set actual HA state
      ansible.builtin.set_fact:
        node_count: "{{ all_nodes | length }}"
        ha_status_actual: "{{ 'enabled' if ha_capable_nodes > 0 else 'disabled' }}"

    # ---------------------------------------------------------
    # 4. HA compliance policy: 2-node = must be enabled, >2 = must be disabled
    # ---------------------------------------------------------
    - name: Determine HA compliance
      ansible.builtin.set_fact:
        ha_compliance_status: >-
          {{ 'Good' if
               (node_count == 2 and ha_status_actual == 'enabled') or
               (node_count > 2 and ha_status_actual == 'disabled')
             else 'Bad' }}
        ha_compliance_details: >-
          {% if node_count == 2 %}
          2-node cluster → HA must be ENABLED. Current: {{ ha_status_actual | upper }}.
          {% else %}
          >2-node cluster → HA must be DISABLED. Current: {{ ha_status_actual | upper }}.
          {% endif %}

    # ---------------------------------------------------------
    # 5. All other health checks (node health is already fixed)
    # ---------------------------------------------------------
    - name: Set other health facts
      ansible.builtin.set_fact:
        critical_alerts: "{{ ontap_health_info.ontap_info.get('private/support/alerts', {}) | json_query('records[? severity == `ERROR` || severity == `EMERGENCY`].[node.name, severity, description]') | default([]) }}"
        unhealthy_nodes: "{{ ontap_health_info.ontap_info.get('cluster/nodes', {}) | json_query('records[? state && state != `up`].[name, state]') | default([]) }}"
        faulty_sensors: "{{ ontap_health_info.ontap_info.get('cluster/sensors', {}) | json_query('records[? state != `normal`].[node.name, name, state, value]') | default([]) }}"
        offline_aggregates: "{{ ontap_health_info.ontap_info.get('storage/aggregates', {}) | json_query('records[? state != `online`].[name, state]') | default([]) }}"
        offline_volumes: "{{ ontap_health_info.ontap_info.get('storage/volumes', {}) | json_query('records[? state != `online`].[name, state]') | default([]) }}"
        broken_disks: "{{ ontap_health_info.ontap_info.get('storage/disks', {}) | json_query('records[? state == `broken` || state == `maintenance`].[name, state]') | default([]) }}"
        offline_shelves: "{{ ontap_health_info.ontap_info.get('storage/shelves', {}) | json_query('records[? state != `online`].[name, state]') | default([]) }}"
        autosupport_issues: "{{ ontap_health_info.ontap_info.get('support/autosupport/check', {}) | json_query('issues_log[].description') | default([]) }}"

    - name: Set status facts
      ansible.builtin.set_fact:
        cluster_alerts_status: "{{ 'Bad' if critical_alerts | length > 0 else 'Good' }}"
        node_health_status: "{{ 'Bad' if unhealthy_nodes | length > 0 else 'Good' }}"
        sensors_health_status: "{{ 'Bad' if faulty_sensors | length > 0 else 'Good' }}"
        aggregate_status: "{{ 'Bad' if offline_aggregates | length > 0 else 'Good' }}"
        volume_status: "{{ 'Bad' if offline_volumes | length > 0 else 'Good' }}"
        disk_status: "{{ 'Bad' if broken_disks | length > 0 else 'Good' }}"
        shelf_status: "{{ 'Bad' if offline_shelves | length > 0 else 'Good' }}"
        autosupport_status: "{{ 'Bad' if autosupport_issues | length > 0 else 'Good' }}"
        ha_status: "{{ ha_compliance_status }}"

    # ---------------------------------------------------------
    # Output
    # ---------------------------------------------------------
    - name: Output HA Configuration
      ansible.builtin.debug:
        msg: "HA Configuration: {{ ha_status }} ({{ node_count }} nodes) – Current HA: {{ ha_status_actual | upper }}"

    - name: Output HA Details (if Bad)
      ansible.builtin.debug:
        msg: "{{ ha_compliance_details }}"
      when: ha_status == 'Bad'

    - name: Output Cluster Alerts Status
      ansible.builtin.debug:
        msg: "Cluster Alerts: {{ cluster_alerts_status }}"
    - name: Output Critical Alerts (if Bad)
      ansible.builtin.debug:
        msg: "Critical Alerts: {{ critical_alerts }}"
      when: cluster_alerts_status == 'Bad'

    - name: Output Node Health Status
      ansible.builtin.debug:
        msg: "Node Health: {{ node_health_status }}"
    - name: Output Unhealthy Nodes (if Bad)
      ansible.builtin.debug:
        msg: "Unhealthy Nodes: {{ unhealthy_nodes }}"
      when: node_health_status == 'Bad'

    - name: Output Sensors Health Status
      ansible.builtin.debug:
        msg: "Sensors Health: {{ sensors_health_status }}"
    - name: Output Faulty Sensors (if Bad)
      ansible.builtin.debug:
        msg: "Faulty Sensors: {{ faulty_sensors }}"
      when: sensors_health_status == 'Bad'

    - name: Output Aggregate Status
      ansible.builtin.debug:
        msg: "Aggregates: {{ aggregate_status }}"
    - name: Output Offline Aggregates (if Bad)
      ansible.builtin.debug:
        msg: "Offline Aggregates: {{ offline_aggregates }}"
      when: aggregate_status == 'Bad'

    - name: Output Volume Status
      ansible.builtin.debug:
        msg: "Volumes: {{ volume_status }}"
    - name: Output Offline Volumes (if Bad)
      ansible.builtin.debug:
        msg: "Offline Volumes: {{ offline_volumes }}"
      when: volume_status == 'Bad'

    - name: Output Disk Status
      ansible.builtin.debug:
        msg: "Disks: {{ disk_status }}"
    - name: Output Broken Disks (if Bad)
      ansible.builtin.debug:
        msg: "Broken Disks: {{ broken_disks }}"
      when: disk_status == 'Bad'

    - name: Output Shelf Status
      ansible.builtin.debug:
        msg: "Shelves: {{ shelf_status }}"
    - name: Output Offline Shelves (if Bad)
      ansible.builtin.debug:
        msg: "Offline Shelves: {{ offline_shelves }}"
      when: shelf_status == 'Bad'

    - name: Output AutoSupport Status
      ansible.builtin.debug:
        msg: "AutoSupport: {{ autosupport_status }}"
    - name: Output AutoSupport Issues (if Bad)
      ansible.builtin.debug:
        msg: "AutoSupport Issues: {{ autosupport_issues }}"
      when: autosupport_status == 'Bad'

    - name: Determine Overall Status
      ansible.builtin.set_fact:
        overall_status: >-
          {{ 'Bad' if ('Bad' in [cluster_alerts_status, node_health_status, sensors_health_status,
                                 aggregate_status, volume_status, disk_status, shelf_status,
                                 autosupport_status, ha_status]) else 'Good' }}

    - name: Output Overall Status
      ansible.builtin.debug:
        msg: "Overall Cluster Health: {{ overall_status }}"

    # Uncomment to make playbook fail on any Bad result
    # - name: Fail if overall health is Bad
    #   ansible.builtin.fail:
    #     msg: "Cluster health check failed – see details above."
    #   when: overall_status == 'Bad'